name: MacFocus
options:
  bundleIdPrefix: com.donaldlin
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 9A686AFY6S
    CODE_SIGN_STYLE: Automatic

targets:
  MacFocus:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacFocus
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donaldlin.macfocus
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: MacFocus/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacFocus/MacFocus.entitlements
        DEVELOPMENT_TEAM: 9A686AFY6S
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacFocus/Info.plist
      properties:
        CFBundleName: Focus Arcana
        CFBundleDisplayName: Focus Arcana
        CFBundleIdentifier: com.donaldlin.macfocus
        CFBundleVersion: "4"
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.productivity

schemes:
  MacFocus:
    build:
      targets:
        MacFocus: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
