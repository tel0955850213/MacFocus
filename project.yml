name: MacFocus
options:
  bundleIdPrefix: com.donaldlin
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 9A686AFY6S
    CODE_SIGN_STYLE: Automatic

targets:
  MacFocus:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacFocus
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donaldlin.macfocus
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: MacFocus/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacFocus/MacFocus.entitlements
        DEVELOPMENT_TEAM: 9A686AFY6S
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacFocus/Info.plist
      properties:
        CFBundleName: Focus Arcana
        CFBundleDisplayName: Focus Arcana
        CFBundleIdentifier: com.donaldlin.macfocus
        CFBundleVersion: "4"
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.productivity

  FocusArcanaIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MacFocusIOS
        type: group
      - path: MacFocus
        type: group
        excludes:
          - MacFocusApp.swift
          - ContentView.swift
          - DesktopPet
          - MenuBar
          - Services/AppLifecycle.swift
          - Info.plist
          - MacFocus.entitlements
          - DesktopPet/PetShaders.metal
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donaldlin.macfocus
        PRODUCT_NAME: FocusArcana
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: MacFocusIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacFocusIOS/MacFocusIOS.entitlements
        DEVELOPMENT_TEAM: 9A686AFY6S
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MacFocusIOS/Info.plist
      properties:
        CFBundleName: Focus Arcana
        CFBundleDisplayName: Focus Arcana
        CFBundleIdentifier: com.donaldlin.macfocus
        CFBundleVersion: "5"
        CFBundleShortVersionString: "1.0"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FocusArcanaIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MacFocusTests
    dependencies:
      - target: FocusArcanaIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donaldlin.macfocus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FocusArcana.app/FocusArcana"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FocusArcanaIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MacFocusUITests
    dependencies:
      - target: FocusArcanaIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donaldlin.macfocus.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacFocus:
    build:
      targets:
        MacFocus: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FocusArcanaIOS:
    build:
      targets:
        FocusArcanaIOS: all
        FocusArcanaIOSTests: [test]
        FocusArcanaIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FocusArcanaIOSTests
        - FocusArcanaIOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
